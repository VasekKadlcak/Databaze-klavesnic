<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Seznam klávesnic</title>
  <script src="/app.js" defer></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      
    }

    header h1 {
      margin: 0;
      text-align: center;
    }

    .pridatButton {
      background: #2563eb;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      color: white;
      font-size: 14px;
    }

    .container {
      padding: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.06);
      transition: 0.2s;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .brand {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .type {
      font-size: 13px;
      background: #e5e7eb;
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 16px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 15px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: auto;
    }

    .actions a {
      text-decoration: none;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .detail {
      background: #e5e7eb;
      color: black;
    }
    .detail:hover {
      background: #d1d5db;
      transition: 0.1s ease-in;
    }

    .edit {
      position: absolute;
      right: 20px;
      background: #2563eb;
      color: white;
    }
    .edit:hover {
      background: #1d4ed8;
      transition: 0.1s ease-in;
    }
    .delete {
      position: absolute;
      top: -8px;
      right: -8px;
    
      background: #ef4444;
      color: white;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .delete:hover {
      background: #dc2626;
      transition: 0.1s ease-in;
    }
    .filter {
      display: flex;
      justify-content: center;   /* vycentrování */
      align-items: center;
      gap: 15px;
      margin: 25px 0;
      padding: 15px 20px;
      background-color: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      flex-wrap: wrap;
    }

    .filter input,
    .filter select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: white;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }
    
    .filter input:focus,
    .filter select:focus {
      border-color: #00bcd4;
      box-shadow: 0 0 5px rgba(0, 188, 212, 0.6);
    }
    
    .filter button {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #00bcd4, #0097a7);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    
    .filter button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 188, 212, 0.5);
    }
    .range-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    input[type="range"] {
      width: 180px;
      margin: 0;
      padding: 0;
      accent-color: #00bcd4;
    }
  </style>
</head>
<body>

<header>
  <h1><em>Databáze Klávesnic</em></h1>

    <form method="GET" action="/" class="filter">

      <div class="range-group">
        <label>Min cena: <span id="minValue">{{minAktualni}}</span> Kč</label>
        <input type="range" name="minCena" min="0" max="{{maxCenaDB}}" step="1" value="{{minAktualni}}" id="minSlider">
      </div>

      <div class="range-group">
        <label>Max cena: <span id="maxValue">{{maxAktualni}}</span> Kč</label>
        <input type="range" name="maxCena" min="0" max="{{maxCenaDB}}" step="1" value="{{maxAktualni}}" id="maxSlider">
      </div>

      <select name="typ">
        <option value="Vše" {{selectedVse}}>Všechny typy</option>
        <option value="Mechanická" {{selectedMechanicka}}>Mechanická</option>
        <option value="Membránová" {{selectedMembranova}}>Membránová</option>
        <option value="Optická" {{selectedOpticka}}>Optická</option>
        <option value="Hybridní" {{selectedHybridni}}>Hybridní</option>
      </select>

      <button type="submit">Filtrovat</button>
    </form>

  <a href="/nova" class="pridatButton">+ Přidat</a>
</header>

<div class="container">
  {{klavesnice}}
</div>

</body>
</html>
