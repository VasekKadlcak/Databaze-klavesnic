<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Upravit klávesnici</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      padding: 50px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 420px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    input{
      width: 94.7%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    select{
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      margin-top: 5px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #0077cc;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #005fa3;
      transition: 0.1s ease-in;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 15px;
      text-decoration: none;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Upravit klávesnici</h1>

    <form method="POST" action="/edit/{{id}}">
      
      <label>Značka</label>
      <input type="text" name="znacka" value="{{znacka}}" required>

      <label>Model</label>
      <input type="text" name="model" value="{{model}}" required>

      <label>Typ spínačů</label>
      <select name="typ">
        <option value="Mechanická" {{mechanicka}}>Mechanická</option>
        <option value="Membránová" {{membranova}}>Membránová</option>
        <option value="Optická" {{opticka}}>Optická</option>
        <option value="Hybridní" {{hybridni}}>Hybridní</option>
      </select>

      <label>Cena (Kč)</label>
      <input type="number" name="cena" value="{{cena}}" required>

      <button type="submit">Uložit změny</button>
    </form>

    <a href="/" class="back">Zpět</a>
  </div>

</body>
</html>
