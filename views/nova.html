<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Přidat klávesnici</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      padding: 50px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 420px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1e40af;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 15px;
      text-decoration: none;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Přidat klávesnici</h1>

    <form method="POST" action="/nova">

      <label>Značka</label>
      <input type="text" name="znacka" required>

      <label>Model</label>
      <input type="text" name="model" required>

      <label>Typ</label>
      <select name="typ">
        <option value="Mechanická">Mechanická</option>
        <option value="Membránová">Membránová</option>
        <option value="Optická">Optická</option>
        <option value="Hybridní">Hybridní</option>
      </select>

      <label>Cena (Kč)</label>
      <input type="number" name="cena" required>

      <button type="submit">Přidat</button>
    </form>

    <a href="/" class="back">Zpět</a>
  </div>

</body>
</html>
